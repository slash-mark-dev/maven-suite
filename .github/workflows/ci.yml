name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Java ${{ matrix.java }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        java: ['17', '21', '25']
        include:
          - os: windows-latest
            java: '21'
          - os: macos-latest
            java: '21'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Build and run all end-to-end tests
        shell: bash
        run: ./build.sh test
      - name: Maven build
        run: mvn -B -ntp verify

  maven-parity:
    name: Differential tests against Maven
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compare versions and dependency resolution with Maven's own libraries
        run: MAVEN_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v mvn)")")")" ./build.sh diff
